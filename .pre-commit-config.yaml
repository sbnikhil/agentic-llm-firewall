repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5 # keep in step with ruff in pyproject.toml
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^tests/data/ # golden/eval data is never rewritten by tooling
