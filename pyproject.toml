[project]
name = "llmfirewall"
version = "0.0.0"
description = "A security checkpoint between people and an AI model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# Pinned to the versions resolved in .venv on 2026-11-19 (see docs/baseline.md).
dependencies = [
    "astrapy==2.3.2",
    "en-core-web-lg==3.8.0",
    "fastapi==0.165.0",
    "langchain-astradb==1.0.0",
    "langchain-community==0.4.2",
    "langchain-huggingface==1.2.3",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.23",
    "numpy==2.4.6",
    "presidio-analyzer==2.2.366",
    "presidio-anonymizer==2.2.366",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "sentence-transformers==6.3.0",
    "spacy==3.8.18",
    "streamlit==1.67.0",
    # Already installed via sentence-transformers; listed directly only so
    # [tool.uv.sources] can route it to the CPU-only index on Linux.
    "torch==2.15.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
# The frozen v0 app is kept as-is and not linted (docs/decisions/0001-retire-v0-app.md).
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

# Remaining violations, labelled by how each will be resolved:
#   legacy      - v0 code that will be frozen under legacy/v0, not fixed
#   restructure - fixed when the code moves into the engine package
#   permanent   - intentional, stays ignored
[tool.ruff.lint.per-file-ignores]
"bench/baseline_v0.py" = ["E402", "E501", "S101", "S603"]  # legacy
"tests/**" = ["S101"]                                      # permanent: pytest uses assert

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = ["legacy", "**/__pycache__", "**/.*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "integration: uses the real Presidio/spaCy and MiniLM models (not offline-mocked)",
]
